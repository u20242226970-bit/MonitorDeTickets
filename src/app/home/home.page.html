<!-- ion-header + ion-toolbar con el título -->
<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Monitor de Tickets</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <p *ngIf="cargando">Cargando tickets...</p>

  
  <ion-card color="light">
    <ion-card-header>
      <ion-card-subtitle>Tasa de resolución</ion-card-subtitle>
      <ion-card-title>{{ porcentajeResueltos }}%</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      {{ resueltos }} de {{ total }} tickets resueltos
    </ion-card-content>
  </ion-card>

 
  <ion-grid>
    <ion-row>
      <ion-col size="12" size-md="4">
        <ion-card>
          <ion-card-header>
            <ion-card-subtitle>Total</ion-card-subtitle>
            <ion-card-title>{{ total }}</ion-card-title>
          </ion-card-header>
        </ion-card>
      </ion-col>

      <ion-col size="12" size-md="4">
        <ion-card>
          <ion-card-header>
            <ion-card-subtitle>Abiertos</ion-card-subtitle>
            <ion-card-title>{{ abiertos }}</ion-card-title>
          </ion-card-header>
        </ion-card>
      </ion-col>

      <ion-col size="12" size-md="4">
        <ion-card>
          <ion-card-header>
            <ion-card-subtitle>Resueltos</ion-card-subtitle>
            <ion-card-title>{{ resueltos }}</ion-card-title>
          </ion-card-header>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>

</ion-content>
